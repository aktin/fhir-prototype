name: Claude PR Review

# Runs once when a PR is opened, reopened or marked ready for review.
# A new push does not trigger a review, to save tokens. To review again,
# remove and add the label "claude-review".
on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
    paths-ignore:
      - "**.md"
      - "uv.lock"
      - "LICENSE"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Post comments directly. The default classifies them with an extra
          # Haiku call that does not show up in the usage numbers below.
          classify_inline_comments: "false"
          prompt: "/pr-review ${{ github.repository }} ${{ github.event.pull_request.number }}"
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(gh pr view *),Bash(gh pr diff *),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments *),mcp__github_inline_comment__create_inline_comment"

      - name: Token usage
        id: usage
        if: always() && steps.claude.outputs.execution_file != ''
        run: |
          .github/scripts/claude-usage.sh "${{ steps.claude.outputs.execution_file }}" usage
          cat usage/claude-usage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload usage
        if: always() && steps.usage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: claude-usage-pr${{ env.PR }}-run${{ env.RUN_ID }}
          path: usage/claude-usage.json
          retention-days: 90

      - name: Comment usage on PR
        if: always() && steps.usage.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "$PR" --repo "${{ github.repository }}" --body-file usage/claude-usage.md
