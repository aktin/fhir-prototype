[project]
name = "fhir-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fhir-resources>=8.3.0",
    "fhirpathpy>=2.2.4",
    "pandas>=3.1.0",
    "pandas-stubs>=3.1.0.261029",
    "psycopg[binary]>=3.3.7",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]